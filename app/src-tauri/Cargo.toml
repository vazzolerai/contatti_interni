[package]
name = "contatti-interni"
version = "0.1.0"
description = "Contatti Interni - messaggistica interna"
edition = "2021"

[lib]
name = "contatti_interni_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Gestore credenziali di Windows
keyring = { version = "3", features = ["windows-native"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[profile.release]
# Eseguibile più piccolo
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
