# Avvia un Supabase temporaneo, applica le migrazioni ed esegue i test di sicurezza.
# Parte a ogni push che tocca la cartella supabase/ e si può lanciare a mano.
name: Test database e sicurezza

on:
  push:
    paths:
      - "supabase/**"
      - ".github/workflows/test-db.yml"
  pull_request:
    paths:
      - "supabase/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Avvia Supabase locale (applica le migrazioni)
        run: supabase start

      - name: Esegui i test di sicurezza
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee risultato-test.txt
        # In caso di errore, il dettaglio compare nel riepilogo dell'esecuzione
        # (visibile senza aprire i log).
      - name: Riepilogo dei test
        if: always()
        run: |
          {
            echo '### Risultato dei test di sicurezza'
            echo '```'
            cat risultato-test.txt 2>/dev/null || echo 'Nessun risultato'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # righe "not ok" e messaggi di errore come annotazioni
          grep -E 'not ok|ERROR|# +(Failed|have|want|caught|wanted|Looks)|psql:' risultato-test.txt 2>/dev/null | head -40 | while IFS= read -r riga; do
            echo "::warning title=Test::${riga}"
          done || true

      - name: Ferma Supabase
        if: always()
        run: supabase stop --no-backup
